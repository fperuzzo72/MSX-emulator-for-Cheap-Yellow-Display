; FNK0103 (Freenove/LCDWIKI "ESP32-32E" 3.5" ST7796 CYD board) - MSX1 emulator
; with a BLE keyboard, built on a vendored fMSX/Z80 core.
;
; Board: plain ESP32-WROOM-32E (Xtensa LX6, no PSRAM on most units - see
; README "Hardware notes"). board=esp32dev is the standard generic profile
; for this chip/module family and works fine here.

[env:fnk0103]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; No OTA slot: fMSX core + TFT_eSPI fonts + NimBLE/Bluetooth stack want
; more app space than the default (two small OTA) partition table gives.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    h2zero/NimBLE-Arduino @ ^1.4.1

build_flags =
    ; --- TFT_eSPI setup for the FNK0103/FNK0114N 3.5" ST7796 panel ---
    ; Pin numbers and SPI settings copied from Freenove's own
    ; TFT_eSPI_Setups/FNK0114N_3.5_320x480_ST7796.h (same physical board,
    ; see README "Hardware reference").
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    ; --- fMSX core build flags (matches the flags used by the reference
    ; ESP32 port this core was pulled from) ---
    -D BPS16
    -D LSB_FIRST
    -D ESP32

    ; --- explicit include paths for the vendored, flat-layout fMSX core ---
    -I lib/fmsx_core/Z80
    -I lib/fmsx_core/fMSX
    -I lib/fmsx_core/EMULib
    -I lib/fmsx_core/video

    -O2

; If your exact board has 8MB or 16MB flash (check the silkscreen/datasheet -
; see README), you can raise this and switch to a bigger partition scheme.
board_upload.flash_size = 4MB
