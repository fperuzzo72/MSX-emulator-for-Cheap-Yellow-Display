name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache PlatformIO packages/toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build both machines
        run: pio run

      - name: Upload MSX firmware
        uses: actions/upload-artifact@v4
        with:
          name: cyd-msx-firmware
          # bootloader.bin + partitions.bin + firmware.bin are everything
          # esptool needs to flash from scratch; firmware.elf is handy for
          # reading crash backtraces (not needed to flash).
          #
          # Note this build has no BIOS of its own: it falls back to C-BIOS,
          # which runs cartridges but not MSX-BASIC. See the README.
          path: |
            .pio/build/msx/firmware.bin
            .pio/build/msx/firmware.elf
            .pio/build/msx/bootloader.bin
            .pio/build/msx/partitions.bin
          if-no-files-found: error
          retention-days: 30

      - name: Upload Spectrum firmware
        uses: actions/upload-artifact@v4
        with:
          # Also built without a ROM, so it will say it has none and stop.
          # Supply one and rebuild; see src/spectrum/spectrum.h.
          name: cyd-spectrum-firmware
          path: |
            .pio/build/spectrum/firmware.bin
            .pio/build/spectrum/firmware.elf
            .pio/build/spectrum/bootloader.bin
            .pio/build/spectrum/partitions.bin
          if-no-files-found: error
          retention-days: 30
